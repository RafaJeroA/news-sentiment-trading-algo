name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Restore annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.7.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Check dependency compatibility
        run: uv pip check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Reproduce synthetic demonstration
        run: uv run news-sentiment-trading synthetic-demo

      - name: Build source and wheel distributions
        run: uv build --out-dir dist/ci

      - name: Smoke-test built artifacts in isolation
        run: |
          uv run python scripts/wheel_smoke.py dist/ci/news_sentiment_trading_algo-1.1.1-py3-none-any.whl
          uv run python scripts/wheel_smoke.py dist/ci/news_sentiment_trading_algo-1.1.1.tar.gz

      - name: Scan repository contents
        run: uv run news-sentiment-trading repository-scan
